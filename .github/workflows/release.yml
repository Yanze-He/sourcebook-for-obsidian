name: Prepare draft release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
  attestations: write
  id-token: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.cjs --tag "$RELEASE_TAG"
      - name: Attest standalone release assets
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create draft with required standalone assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" main.js manifest.json styles.css --draft --title "Sourcebook $RELEASE_TAG" --notes-file RELEASE_NOTES.md
